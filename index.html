<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JackAnismo – Link Game</title>
<link rel="icon" type="image/x-icon" href="avatar.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<main class="wrap">
  <button class="btn" id="theme" type="button" aria-label="Ganti tema" title="Ganti tema"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  <header class="profile">
    <img class="avatar" id="avatar" alt="Foto profil JackAnismo" width="144" height="144" src="assets/images/avatar.jpg">
    <h1 id="name">JackAnismo</h1>
    <p class="bio" id="bio">Nebula Elang ✨</p>
    <span class="status"><span class="dot"></span><span><span id="status">ONLINE</span> <time id="clock">--:--:--</time></span></span>
  </header>

  <ul class="list" id="links"></ul>
  <p class="notice" id="notice" role="status" hidden>Sedang perbaikan, game kembali segera</p>

  <ul class="list" id="games"></ul>

<footer class="copy">© 2027 JackAnismo</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/script.js"></script>
</body>
</html>
